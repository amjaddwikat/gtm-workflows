name: Workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail on client / prospect data in workflow exports
        run: python scripts/check_sanitized.py workflows
      - name: Lint n8n node graphs (broken references, duplicate names)
        run: python scripts/lint_workflows.py workflows
